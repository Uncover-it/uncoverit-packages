name: Publish to PyPI

on:
  workflow_dispatch:
    inputs:
      bump:
        description: "Version bump to apply to pypi/pyproject.toml"
        type: choice
        required: true
        default: patch
        options:
          - patch
          - minor
          - major
      dry_run:
        description: "Bump and build only - do not publish, commit or tag"
        type: boolean
        default: false

concurrency:
  group: publish-pypi
  cancel-in-progress: false

jobs:
  publish:
    runs-on: ubuntu-latest
    permissions:
      contents: write # push the version bump commit, tag and release
      id-token: write # PyPI trusted publishing + attestations

    defaults:
      run:
        working-directory: ./pypi

    steps:
      - name: Checkout code
        uses: actions/checkout@v7
        with:
          fetch-depth: 0

      # Pinned to a full semver tag on purpose: astral-sh stopped publishing
      # floating major tags after v7, so `@v10` does not resolve.
      - name: Setup uv
        uses: astral-sh/setup-uv@v10.0.1
        with:
          version: latest

      - name: Bump version
        id: bump
        run: |
          VERSION="$(uv version --frozen --bump "${{ inputs.bump }}" --output-format json | jq -r .version)"
          echo "version=${VERSION}" >> "$GITHUB_OUTPUT"

      - name: Build distribution
        run: uv build

      # Publishing happens before the commit so that a failed publish leaves
      # the repository untouched and the run can simply be retried.
      - name: Publish to PyPI
        if: ${{ !inputs.dry_run }}
        uses: pypa/gh-action-pypi-publish@release/v1
        with:
          packages-dir: ./pypi/dist/

      - name: Commit, tag and push
        if: ${{ !inputs.dry_run }}
        working-directory: .
        env:
          VERSION: ${{ steps.bump.outputs.version }}
          BRANCH: ${{ github.ref_name }}
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add pypi/pyproject.toml
          git commit -m "pypi: release v${VERSION}"
          git pull --rebase origin "${BRANCH}"
          git tag "pypi-v${VERSION}"
          git push origin "HEAD:${BRANCH}"
          git push origin "pypi-v${VERSION}"

      - name: Create GitHub release
        if: ${{ !inputs.dry_run }}
        working-directory: .
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          VERSION: ${{ steps.bump.outputs.version }}
        run: |
          gh release create "pypi-v${VERSION}" \
            --title "uncoverit (PyPI) v${VERSION}" \
            --generate-notes
