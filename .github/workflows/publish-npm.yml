name: Publish to NPM

on:
  release:
    types: [published]

jobs:
  build-and-publish:
    if: startsWith(github.ref, 'refs/tags/npm-')
    permissions:
      contents: read
    runs-on: ubuntu-latest

    # run everything in ./npm
    defaults:
      run:
        working-directory: ./npm

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      # setup bun
      - name: Setup Bun
        uses: oven-sh/setup-bun@v1
        with:
          bun-version: latest

      # setup node
      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "20"
          registry-url: "https://registry.npmjs.org"

      - name: Install dependencies
        run: bun install

      # publish to npm
      - name: Publish to NPM
        run: npm publish --access public
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}
